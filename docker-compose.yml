# compose file
services:

    web:
      build: .
      volumes:
        - .:/flight-app/
      ports:
        - "8000:8000"
      networks:
        - airlinex-network

    db:
      image: postgres:16
      environment:
        - POSTGRES_DB=airlinex_db
        - POSTGRES_USER=airlinex_user
        - POSTGRES_PASSWORD=airlinex_pass
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U airlinex_user -d airlinex_db"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 30s
      ports:
        - "5432:5432"
      networks:
        - airlinex-network
   
    postgres-exporter:
      image: prometheuscommunity/postgres-exporter:v0.15.0
      environment:
        DATA_SOURCE_NAME: "postgresql://airlinex_user:airlinex_pass@db:5432/airlinex_db?sslmode=disable"
      ports:
        - "9187:9187"
      networks:
        - airlinex-network

    prometheus:
      image: prom/prometheus:v2.47.0
      volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml
      ports:
        - "9090:9090"
      networks:
        - airlinex-network
    grafana:
      image: grafana/grafana:11.2.0
      ports:
      - "3000:3000"
      environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=admin
        - GF_USERS_ALLOW_SIGN_UP=false
      volumes:
      - grafana_data:/var/lib/grafana
      depends_on:
        - prometheus
      networks:
        - airlinex-network


# persist data to volume
volumes:
  postgres_data:
  grafana_data:
  
networks:
  airlinex-network:
    driver: bridge
